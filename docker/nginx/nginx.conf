# =============================================
# CycleRace Pro — Nginx Reverse Proxy
# Punto de entrada único (puerto 80)
# Elimina todos los problemas de CORS y puertos
# =============================================

upstream node_api {
    server node-api:3001;
}

upstream monitor_api {
    server monitor-backend:8000;
}

upstream log_analyzer {
    server log-backend:8081;
}

upstream frontend_dev {
    server frontend:5173;
}

server {
    listen 80;
    server_name localhost;

    # ─── Frontend React (Vite dev server) ───
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── API Principal (Node.js/Express — Auth, Eventos, Inscripciones) ───
    location /api/ {
        proxy_pass http://node_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Monitor de Microservicios (FastAPI) ───
    location /monitor/ {
        rewrite ^/monitor/(.*) /$1 break;
        proxy_pass http://monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Log Analyzer (Go service) ───
    location /analyzer/ {
        rewrite ^/analyzer/(.*) /$1 break;
        proxy_pass http://log_analyzer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Vite HMR WebSocket ───
    location /ws {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
